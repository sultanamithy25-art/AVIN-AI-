/* AVIN Midnight Aurora: premium immersive layer */
:root{--champagne:#ecdcb8;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;--hair:rgba(190,235,226,.16)}
html,body{height:100%}
body{font-family:var(--sans);overflow:hidden;background:#050914}
body:before{z-index:0;animation:twinkle 7s ease-in-out infinite alternate}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:52vmax;height:34vmax;left:12%;top:4%;background:radial-gradient(closest-side,#1f8f85aa,transparent)}
.aurora i:nth-child(2){width:44vmax;height:30vmax;right:8%;top:22%;background:radial-gradient(closest-side,#3f62d088,transparent);animation-duration:24s;animation-delay:-6s}
.aurora i:nth-child(3){width:40vmax;height:26vmax;left:30%;bottom:6%;background:radial-gradient(closest-side,#7c6fe066,transparent);animation-duration:30s;animation-delay:-12s}
@keyframes drift{to{transform:translate(9vmax,6vmax) scale(1.18) rotate(14deg)}}
@keyframes twinkle{from{opacity:.35}to{opacity:.8}}
.app{z-index:1;height:100vh;height:100dvh;min-height:0;max-width:1120px;padding:14px;gap:14px;grid-template-columns:68px minmax(0,1fr)}
.sidebar{position:relative;top:0;align-self:center;border:1px solid var(--hair);border-radius:24px;padding:8px 6px;background:rgba(9,22,28,.62)}
.nav{gap:4px}
.nav button{font:500 10px var(--sans);letter-spacing:.04em;padding:9px 2px 8px;border-radius:16px;color:#a9c4c4;transition:color .25s,background .25s,transform .25s}
.nav button span{margin:0 auto 4px;width:21px;height:21px;font:0/0 a}
.nav button svg,.pill-icon svg{display:block;width:100%;height:100%}
.nav button:hover{transform:translateY(-1px)}
.nav button.active,.nav button:hover{color:var(--white);background:linear-gradient(150deg,rgba(142,197,255,.2),rgba(49,122,120,.22));border-color:rgba(190,235,226,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
main{min-height:0;height:100%;padding:0;overflow-y:auto;scrollbar-width:none}
main::-webkit-scrollbar,.chatlog::-webkit-scrollbar{display:none}
.top{flex:none;justify-content:flex-end;align-items:center;gap:8px;min-height:40px}
.brand{display:none;align-items:center;gap:9px;margin-right:auto}
.brand img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 0 8px #8ec5ff90)}
.brand b{font:500 20px var(--serif);letter-spacing:.2em}
.brand small{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#9fd8cc}
.brand small:before{content:"";width:6px;height:6px;border-radius:50%;background:#7ff0d6;box-shadow:0 0 8px #7ff0d6}
.brand-text{display:flex;flex-direction:column;gap:1px;line-height:1.1}
.pill{padding:7px 13px;font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--champagne);border-color:rgba(236,220,184,.3);background:rgba(9,22,28,.6)}
.pill-icon{width:34px;height:34px;padding:7px;color:#cfe6e2;border-color:var(--hair)}
.hero{flex:none;padding:2px 0 12px}
.logo-wrap{width:clamp(96px,19vh,152px);height:clamp(96px,19vh,152px);margin-bottom:8px;border-color:rgba(190,235,226,.28);transform:translate(calc(var(--mx,0)*9px),calc(var(--my,0)*9px));transition:transform .35s ease-out}
.logo-wrap:after{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 58%,#8ec5ff 72%,var(--champagne) 84%,#7ff0d6 93%,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:spin 7s linear infinite}
.logo-wrap .swan-img{width:79%;height:79%;animation:float 5.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-5px) scale(1.025)}}
h1{font:400 clamp(32px,6vh,46px)/1 var(--serif);letter-spacing:.34em;margin:2px 0 6px .34em;background:linear-gradient(100deg,#fff 20%,var(--champagne) 42%,#bff3e6 58%,#fff 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:sheen 8s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
.tagline{font:500 9.5px var(--sans);letter-spacing:.32em;color:#9fd8cc}
.always{font:italic 400 clamp(16px,2.6vh,20px) var(--serif);margin-top:7px}
.glass{background:linear-gradient(135deg,rgba(26,62,66,.5),rgba(8,20,27,.62));border-color:var(--hair);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.welcome{flex:none;width:min(100%,640px);padding:11px 16px;gap:12px;margin-bottom:10px}
.mini-logo{flex-basis:40px;width:40px;height:40px;border-color:var(--hair)}.mini-logo .swan-img{width:32px;height:32px}
.welcome h2{font:500 19px var(--serif);margin:0 0 1px}.welcome p{font-size:12.5px;line-height:1.4}.widebreak{display:none}
.tiles{flex:none;width:min(100%,640px);grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;overflow:hidden;flex-direction:column;align-items:flex-start;gap:7px;padding:11px 12px;font-family:var(--sans);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.1) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.tile:hover{transform:translateY(-3px);border-color:rgba(236,220,184,.45)}.tile:hover:after{transform:translateX(120%)}.tile:active{transform:scale(.96)}
.tile-icon{width:30px;height:30px;padding:6px;color:#bff3e6;border-color:var(--hair);background:rgba(16,35,68,.55)}.tile-icon svg{display:block;width:100%;height:100%}
.tile b{font-size:13px;font-weight:500}.tile small{font-size:11px;margin-top:2px;line-height:1.25}.arrow{display:none}
.spacer{min-height:8px}
.chatlog{display:none;flex:1;min-height:0;width:min(100%,720px);margin:0 auto;padding:10px 2px 14px;overflow-y:auto;gap:12px;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 16px,#000 calc(100% - 12px),transparent);mask:linear-gradient(transparent,#000 16px,#000 calc(100% - 12px),transparent)}
body.chatting main{overflow:hidden}
body.chatting .hero,body.chatting .welcome,body.chatting .tiles,body.chatting .spacer,body.chatting .footer{display:none}
body.chatting .chatlog{display:flex}
body.chatting .brand{display:flex}
.message{position:relative;flex:none;max-width:82%;padding:10px 14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .38s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}}
.user{border-radius:18px 18px 5px 18px;background:linear-gradient(140deg,#2c6f73,#1d4a63);border:1px solid rgba(142,197,255,.3)}
.bot{margin-left:36px;border-radius:5px 18px 18px 18px;background:rgba(14,31,38,.76);border:1px solid var(--hair);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bot:before{content:"";position:absolute;left:-36px;top:0;width:28px;height:28px;border-radius:50%;border:1px solid rgba(190,235,226,.3);background:#0f2430 var(--swan,none) center/80% no-repeat;box-shadow:0 0 12px #8ec5ff44}
.bot.thinking{color:transparent;min-width:64px;user-select:none}
.bot.thinking:after{content:"";position:absolute;left:16px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#bff3e6;box-shadow:13px 0 #8ec5ff,26px 0 var(--champagne);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:translateY(-3px)}}
.composer{flex:none;width:min(100%,720px);margin:0 auto;bottom:0;gap:6px;padding:5px 5px 5px 12px;border-color:rgba(190,235,226,.24);background:rgba(7,19,23,.86);box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .3s,box-shadow .3s}
.composer:focus-within{border-color:#8ec5ff;box-shadow:0 0 0 3px rgba(142,197,255,.14),0 0 34px rgba(79,140,255,.3)}
.composer .star{font-size:17px;padding:0 2px;color:var(--champagne);text-shadow:0 0 10px #ecdcb888;animation:float 4s ease-in-out infinite}
.composer input,.composer input:focus{background:transparent;font:16px var(--sans);padding:9px 4px}
.send{flex:none;width:40px;height:40px;padding:10px;color:#04211f;border:0;background:linear-gradient(145deg,#c9f6ea,#8ec5ff);box-shadow:0 0 16px #8ec5ff55;transition:transform .2s}.send svg{display:block;width:100%;height:100%;stroke-width:2.2}
.send:hover{transform:translateY(-2px)}.send:active{transform:scale(.88)}
.footer{flex:none;font-size:10.5px;letter-spacing:.08em;margin:8px 0 0;opacity:.6}
:focus-visible{outline:2px solid #bff3e6;outline-offset:2px}.composer input:focus-visible{outline:0}
@media(max-width:650px){
.app{grid-template-columns:54px minmax(0,1fr);padding:10px 10px calc(10px + env(safe-area-inset-bottom)) 8px;gap:8px}
.sidebar{align-self:center;border-radius:20px;padding:5px 3px}
.nav{gap:3px}.nav button{font-size:9.5px;letter-spacing:0;padding:9px 0 7px;border-radius:14px}.nav button span{width:20px;height:20px;margin-bottom:3px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{flex-direction:row;align-items:center;gap:6px;padding:9px 8px}.tile-icon{display:block;flex:none}.tile small{display:none}
.composer{gap:4px;padding:4px 4px 4px 11px}.composer input{font-size:16px;padding:9px 3px}.send{width:40px;height:40px;font-size:0}.star{font-size:17px}
.message{max-width:92%}.bot{margin-left:32px}.bot:before{left:-32px;width:26px;height:26px}.footer{display:none}
.welcome{padding:9px 12px}.tagline{letter-spacing:.24em;font-size:9px}.logo-wrap .swan-img{width:79%;height:79%}
.logo-wrap{width:clamp(88px,17vh,136px);height:clamp(88px,17vh,136px)}
}
@media(max-width:390px){.tile b{font-size:12.5px}.tile-icon{display:block;width:26px;height:26px;padding:5px}}

/* Fun and Work modes */
.modes{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border:1px solid var(--hair);border-radius:30px;background:rgba(9,22,28,.66)}
.modes:before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:30px;background:linear-gradient(135deg,var(--champagne),#bff3e6);box-shadow:0 0 14px #ecdcb855;transition:transform .32s cubic-bezier(.3,1.3,.5,1),background .3s,box-shadow .3s}
.modes button{position:relative;min-width:48px;border:0;background:none;padding:6px 12px;border-radius:30px;font:500 12px var(--sans);letter-spacing:.02em;color:#b4cdcb;cursor:pointer;transition:color .25s}

/* AVIN ultra layer: sheets, tools, voice and chat actions */

.sheet{position:fixed;z-index:31;left:50%;bottom:0;width:min(100%,560px);max-height:86dvh;overflow-y:auto;transform:translateX(-50%);padding:9px 18px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--hair);border-bottom:0;border-radius:26px 26px 0 0;background:linear-gradient(170deg,#12302f,#071218 60%);box-shadow:0 -24px 70px rgba(0,0,0,.55);animation:sheetup .36s cubic-bezier(.2,.95,.25,1) both;scrollbar-width:none}

.field{width:100%;display:block;padding:11px 13px;border:1px solid var(--hair);border-radius:13px;background:rgba(3,12,16,.7);color:var(--white);font:16px/1.4 var(--sans);resize:vertical;outline:0}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:3px;padding:12px;text-align:left;border:1px solid var(--hair);border-radius:15px;background:rgba(23,58,60,.42);color:var(--white);font-family:var(--sans);cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:rgba(236,220,184,.5)}.card:active{transform:scale(.97)}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{padding:10px 15px;border:1px solid rgba(190,235,226,.28);border-radius:12px;background:rgba(23,58,60,.55);color:var(--white);font:500 13px var(--sans);cursor:pointer}

@media(max-width:430px){body.chatting .brand-text{display:none}.star{display:none}.composer{padding-left:7px}.composer .mic{width:36px}}

.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
.opt-label{margin:12px 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9fd8cc}

.plugin-banner b{display:block;font-size:14.5px;font-weight:500}.plugin-banner small{color:#c0d9d6;font-size:12px}
.plug{border-bottom:1px solid var(--hair);padding:10px 0}
.plug-top{display:flex;align-items:center;gap:10px}
.plug-ico{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(142,197,255,.12);font-size:20px}
.plug-txt{flex:1;min-width:0}.plug-txt b{display:block;font-size:14px;font-weight:500}.plug-txt small{display:block;color:#a7c4c3;font-size:12px;line-height:1.3}
.plug-ai{color:#ecdcb8;font-size:10px;margin-left:5px;font-weight:400}
.plug-go{display:flex;gap:6px;margin-top:8px}.plug-go[hidden]{display:none}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px;white-space:nowrap}
.tags-scroll{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}.tags-scroll::-webkit-scrollbar{display:none}.tags-scroll .tag{flex:none}
.plugin-card .plug-head{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.06em;color:#9fd8cc;margin-bottom:5px}
.plugin-card h5{margin:0 0 5px;font:500 18px/1.25 var(--serif)}
.plugin-card .msg-body{font-size:13.5px}
.plugin-card img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-bottom:8px;background:#fff1}
.idea{margin-top:10px;padding:14px;border:1px solid var(--hair);border-radius:17px;background:linear-gradient(140deg,rgba(35,84,84,.5),rgba(9,22,30,.7));animation:rise .4s ease both}
.idea-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.idea h5{margin:0;font:500 21px/1.2 var(--serif)}
.score{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--champagne) calc(var(--s)*10%),rgba(255,255,255,.1) 0)}
.score b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#0c2126;font-size:14px;font-weight:500}
.idea .hook{margin:7px 0;color:#f2f7f6;font-size:14px;line-height:1.45}
.idea dl{margin:0;font-size:12.5px;line-height:1.45;color:#b7cfcc}.idea dt{display:inline;color:#ecdcb8}.idea dd{display:inline;margin:0}.idea dd:after{content:"";display:block;height:4px}

.vibe-l{display:flex;justify-content:space-between;font-size:11px;color:#8fb2b1}
.slash{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);max-height:220px;overflow-y:auto;z-index:6;padding:5px;border:1px solid var(--hair);border-radius:15px;background:#0b1e24;box-shadow:0 14px 34px rgba(0,0,0,.5);scrollbar-width:none}
.slash button{display:flex;gap:9px;align-items:baseline;width:100%;padding:8px 9px;border:0;border-radius:10px;background:none;color:var(--white);font:13px var(--sans);text-align:left;cursor:pointer}
.slash button:hover{background:rgba(142,197,255,.12)}.slash small{color:#8fb2b1;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attached{position:absolute;left:12px;bottom:calc(100% + 6px);z-index:5;display:flex;align-items:center;gap:7px;max-width:calc(100% - 24px);padding:5px 10px;border:1px solid var(--hair);border-radius:13px;background:#0e2a2e;font-size:12px}

html[data-theme=rose] .app,html[data-theme=rose] .sheet{filter:hue-rotate(155deg)}html[data-theme=rose] .aurora{filter:blur(70px) hue-rotate(155deg)}
html[data-theme=violet] .app,html[data-theme=violet] .sheet{filter:hue-rotate(75deg)}html[data-theme=violet] .aurora{filter:blur(70px) hue-rotate(75deg)}

/* AVIN v4: talk mode, brief, levels, characters, arcade */
.brief{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:min(100%,640px);margin:0 0 10px}
.brief button{padding:6px 11px;border:1px solid var(--hair);border-radius:15px;background:rgba(9,22,28,.6);color:#d9f3ec;font:500 12px var(--sans);cursor:pointer;transition:transform .2s,border-color .2s}
.brief button:hover{transform:translateY(-1px);border-color:rgba(236,220,184,.45)}
body.chatting .brief{display:none}
.talk,.arcade{position:fixed;inset:0;z-index:48;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:radial-gradient(ellipse at 50% 42%,#123d3d 0%,#07131b 55%,#03070d 100%);animation:fade .3s ease both}
.talk .x,.arcade .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
.orb{position:relative;display:grid;place-items:center;width:210px;height:210px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 36% 30%,#5fb9ae,#173f58 62%,#0a1a2c);box-shadow:0 0 60px #8ec5ff55,inset 0 0 40px #bff3e633}
.orb img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 0 14px #e8f7ff)}
.orb:before,.orb:after{content:"";position:absolute;inset:-10px;border:1px solid #bff3e666;border-radius:50%;opacity:0}
.talk[data-s=listening] .orb:before{animation:ring 1.8s ease-out infinite}.talk[data-s=listening] .orb:after{animation:ring 1.8s .9s ease-out infinite}
.talk[data-s=thinking] .orb{animation:thinkorb 1.1s ease-in-out infinite}
.talk[data-s=speaking] .orb{animation:speakorb .55s ease-in-out infinite alternate}
@keyframes ring{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.55)}}
@keyframes thinkorb{50%{box-shadow:0 0 90px #ecdcb888,inset 0 0 50px #ecdcb855;transform:scale(.96)}}
@keyframes speakorb{to{transform:scale(1.07);box-shadow:0 0 100px #8ec5ffaa,inset 0 0 50px #bff3e655}}
.talk-state{font:500 26px var(--serif);text-align:center}
.talk-cap{min-height:64px;max-width:520px;max-height:30vh;overflow:auto;text-align:center;color:#b7cfcc;font-size:14.5px;line-height:1.5;scrollbar-width:none}
.level{padding:13px;border:1px solid rgba(236,220,184,.3);border-radius:16px;background:rgba(236,220,184,.07)}
.level b{font:500 21px var(--serif)}.level small{float:right;color:#d8c9a6;font-size:12px;margin-top:6px}
.bar{height:6px;margin-top:9px;overflow:hidden;border-radius:6px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#bff3e6,var(--champagne));transition:width .5s}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}
.badge{padding:8px 3px;text-align:center;border:1px solid var(--hair);border-radius:12px;font-size:10px;line-height:1.2;color:#9ab6b4}.badge span{display:block;font-size:21px;margin-bottom:3px;filter:grayscale(1);opacity:.35}
.badge.on{color:#fff;border-color:rgba(236,220,184,.5)}.badge.on span{filter:none;opacity:1}
.card.on{border-color:var(--champagne);background:rgba(236,220,184,.14)}
.arcade{padding:0;gap:0}.arcade canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.sounds .tag{font-size:12px}

/* Media plugins */
.player{display:block;width:100%;aspect-ratio:16/9;margin:9px 0 3px;border:0;border-radius:12px;background:#000}.player.spot{aspect-ratio:auto;height:152px}

/* AVIN clean layout: fewer things on screen at once */

.badges{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.badge{border:0;padding:0;font-size:0}.badge span{font-size:22px;margin:0}

/* Game mode */
.modes{grid-template-columns:1fr 1fr 1fr}.modes:before{width:calc(33.333% - 2px)}.modes button{min-width:0;padding:6px 10px}
body.mode-game .modes:before{transform:translateX(200%);background:linear-gradient(135deg,#ffd27a,#ff8ac4);box-shadow:0 0 16px #ff8ac466}
body.mode-game .aurora{filter:blur(70px) hue-rotate(95deg) saturate(1.4);opacity:.9}
body.mode-game .brand small{color:#ffb8d9}body.mode-game .brand small:before{background:#ff8ac4;box-shadow:0 0 8px #ff8ac4}
.hub{display:none;width:min(100%,640px);margin:0 auto;padding:6px 0 10px}
body.mode-game:not(.chatting) .hub{display:block}
body.mode-game .hero,body.mode-game .welcome,body.mode-game .brief{display:none!important}
.hub-title{margin:0;font:500 clamp(30px,5.5vh,40px)/1.1 var(--serif);text-align:center;background:linear-gradient(100deg,#ffd27a,#ff8ac4,#bff3e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hub-sub{margin:4px 0 0;text-align:center;font-size:12.5px;color:#b9c3d6}
.hub h4{margin:16px 0 8px;font:500 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#ffc9e3}
.hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.hub-grid.small{grid-template-columns:repeat(2,minmax(0,1fr))}
.hub-game{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid rgba(255,190,220,.22);border-radius:18px;background:linear-gradient(150deg,rgba(90,48,110,.5),rgba(14,20,40,.75));color:var(--white);text-align:center;font-family:var(--sans);cursor:pointer;transition:transform .2s,border-color .2s}
.hub-game:hover{transform:translateY(-3px);border-color:#ffd27a}.hub-game:active{transform:scale(.95)}
.hub-ico{font-size:30px;line-height:1}.hub-txt b{display:block;font-size:13px;font-weight:500}.hub-txt small{display:block;margin-top:2px;font-size:11px;color:#b9c3d6}
.hub-grid.small .hub-game{flex-direction:row;text-align:left;gap:9px;padding:9px 11px}.hub-grid.small .hub-ico{font-size:21px}
.gshell{gap:14px;padding:24px 16px}.gshell h3{margin:0;font:500 32px var(--serif)}
.gbody{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100%,380px)}.ginfo{margin:0;min-height:20px;color:#d9f3ec;font-size:14.5px}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;width:100%}
.mem-card{aspect-ratio:3/4;border:1px solid rgba(190,235,226,.3);border-radius:13px;background:linear-gradient(145deg,#1d4f55,#16243f);color:#fff;font-size:30px;cursor:pointer;transition:transform .2s,background .2s}
.mem-card.up{transform:rotateY(180deg) scaleX(-1);background:#10303a}.mem-card.won{border-color:#ffd27a;box-shadow:0 0 14px #ffd27a66}
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:min(100%,300px)}
.ttt-cell{aspect-ratio:1;border:1px solid rgba(190,235,226,.3);border-radius:15px;background:rgba(16,42,48,.7);color:#fff;font-size:44px;cursor:pointer}.ttt-cell.won{border-color:#ffd27a;box-shadow:0 0 18px #ffd27a77;color:#ffd27a}

/* Dominoes and Swan Shuffle */
.gshell{justify-content:flex-start;padding-top:calc(52px + env(safe-area-inset-top));overflow-y:auto}.gbody{width:min(100%,560px)}
.gsmall{margin:0;font-size:12px;color:#a7c4c3}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;width:100%}
.domino{display:inline-flex;flex-direction:column;gap:3px;padding:5px;border:1px solid #d7c9a5;border-radius:10px;background:linear-gradient(160deg,#fbf6e7,#e6dcc2);cursor:pointer}
span.domino{cursor:default}.domino.no{opacity:.4}.domino.ok{box-shadow:0 0 12px #ffd27a88}.domino.mini{flex-direction:row;padding:2px;gap:2px;border-radius:6px}
.pips{display:grid;grid-template-columns:repeat(3,7px);grid-auto-rows:7px;gap:2px;padding:2px}.pips i{border-radius:50%}.pips i.on{background:#1b2a3a}
.domino .pips+.pips{border-top:1px solid #b9ab8a;padding-top:4px}
.domino.mini .pips{grid-template-columns:repeat(3,4px);grid-auto-rows:4px;gap:1px;padding:1px}.domino.mini .pips+.pips{border-top:0;border-left:1px solid #b9ab8a;padding:1px 1px 1px 3px}
.chain{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:34px;max-height:30dvh;width:100%;overflow-y:auto;padding:8px;border:1px solid var(--hair);border-radius:14px;background:rgba(5,16,22,.6)}
.sc{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;width:54px;height:78px;border:1px solid rgba(255,255,255,.3);border-radius:11px;color:#fff;font-family:var(--sans);cursor:pointer;transition:transform .15s}
span.sc{cursor:default}button.sc.ok:hover{transform:translateY(-4px)}.sc small{position:absolute;top:3px;left:5px;font-size:11px}.sc b{font:500 25px var(--serif);line-height:1}.sc em{font-style:normal;font-size:8.5px;margin-top:2px}
.sc.moon{background:linear-gradient(150deg,#3d4bb0,#1b2257)}.sc.wave{background:linear-gradient(150deg,#1d8a84,#0c3b46)}.sc.feather{background:linear-gradient(150deg,#b48a3c,#5a3e14)}.sc.lotus{background:linear-gradient(150deg,#c0548f,#5b1d4a)}.sc.wild{background:conic-gradient(from 40deg,#3d4bb0,#1d8a84,#b48a3c,#c0548f,#3d4bb0)}
.sc.no{opacity:.42}.sc.ok{box-shadow:0 0 12px #ffd27a77}.sc.big{transform:scale(1.2);margin:8px}.sc.back{width:17px;height:25px;border-radius:4px;background:linear-gradient(145deg,#1d4f55,#16243f);cursor:default}
.backs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px}.row.mid{justify-content:center;gap:16px}
@media(max-width:390px){.hub-grid:not(.small){grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Chat history */
.user .msg-actions{display:none;justify-content:flex-end;margin:6px -4px -4px}.user.open .msg-actions,.user:hover .msg-actions{display:flex}.user .msg-actions button{color:#d9f3ec}
.hist-bulk{margin-top:8px}.hist-bulk:empty{display:none}
.hist{border-bottom:1px solid var(--hair)}.hist-top{display:flex;align-items:center;gap:8px}.hist-top input[type=checkbox]{flex:none;width:18px;height:18px;accent-color:#8ec5ff}
.hist-main{flex:1;min-width:0;padding:10px 2px;border:0;background:none;color:var(--white);text-align:left;font-family:var(--sans);cursor:pointer}
.hist-main b,.hist-main small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.hist-main b{font-size:14px;font-weight:500}.hist-main small{margin-top:2px;font-size:11.5px;color:#8fb2b1}
.hist.cur .hist-main b{color:var(--champagne)}
.hist-dots{min-width:36px;min-height:36px;font-size:18px;color:#cfe6e2}
.hist-acts{display:none;flex-wrap:wrap;gap:6px;padding:0 0 10px}.hist-acts.on{display:flex}.hist-acts .field{flex:1 1 100%;font-size:16px}
.hist-empty{padding:18px 0;text-align:center}

/* Sync */
.sync-code{margin:8px 0;padding:11px;border:1px dashed rgba(236,220,184,.45);border-radius:12px;background:rgba(3,12,16,.6);font:500 13px ui-monospace,Consolas,monospace;text-align:center;letter-spacing:.04em;overflow-wrap:anywhere}

/* Keep the dark design and true image colors */
:root{color-scheme:only dark}
html,body{background-color:#050914}
html[data-theme=rose] .art,html[data-theme=rose] .gallery img,html[data-theme=rose] .plugin-card img,html[data-theme=rose] .plugin-card video,html[data-theme=rose] .player{filter:hue-rotate(-155deg)}
html[data-theme=violet] .art,html[data-theme=violet] .gallery img,html[data-theme=violet] .plugin-card img,html[data-theme=violet] .plugin-card video,html[data-theme=violet] .player{filter:hue-rotate(-75deg)}
html[data-theme=ember] .art,html[data-theme=ember] .gallery img,html[data-theme=ember] .plugin-card img,html[data-theme=ember] .plugin-card video,html[data-theme=ember] .player{filter:hue-rotate(-205deg)}
html[data-theme=forest] .art,html[data-theme=forest] .gallery img,html[data-theme=forest] .plugin-card img,html[data-theme=forest] .plugin-card video,html[data-theme=forest] .player{filter:hue-rotate(40deg)}

/* Soul and Studio */
.feel{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;margin-top:6px;font-size:12px;color:#8fb2b1}
.feel:empty{display:none}.feel span{width:100%;text-align:center;margin-bottom:2px}
.feel button{border:0;background:none;font-size:22px;padding:2px 5px;cursor:pointer;transition:transform .15s}.feel button:hover{transform:scale(1.25)}
body.chatting .feel,body.mode-game .feel,body.mode-work .feel{display:none}
.mood-strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.mood-day{display:flex;flex-direction:column;align-items:center;min-width:34px}.mood-day b{font-size:20px;font-weight:400}.mood-day small{font-size:9.5px;color:#8fb2b1}
.support{border-color:rgba(255,200,180,.5)!important;background:rgba(60,30,40,.7)!important}.support h5{margin:0 0 5px;font:500 18px var(--serif)}
.support-link{display:inline-block;margin-top:9px;padding:7px 12px;border-radius:12px;background:#f4e3c8;color:#2a1a10;font-size:13px;font-weight:500;text-decoration:none}
.build-card h5{margin:0;font:500 18px/1.3 var(--serif)}.build-card .msg-actions{display:flex!important}
.builder{position:fixed;inset:0;z-index:49;display:flex;flex-direction:column;background:#050914;animation:fade .25s ease both}
.builder-bar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--hair)}.builder-bar b{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:500 17px var(--serif)}
.builder iframe{flex:1;width:100%;border:0;background:#0b1620}
.builder-edit{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--hair)}.builder-edit .field{flex:1}
.tabs .tab{font-size:12px}

/* Phase 3: Swan Mind, Cyber Shield, Money Lens */
.verdict{margin-top:12px;padding:13px;border-radius:15px;border:1px solid var(--hair);background:rgba(10,30,34,.7);animation:rise .3s ease both}
.verdict b{font-size:15px;font-weight:500}.verdict small{display:block;margin-top:4px;color:#a7c4c3;font-size:11.5px}.verdict ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.5}.verdict p{margin:8px 0 0!important;color:#e6f2f0!important}
.verdict .bar{margin-top:8px}.verdict.safe{border-color:#6fd3a0}.verdict.safe .bar i{background:#6fd3a0}.verdict.suspicious{border-color:#f0c35a}.verdict.suspicious .bar i{background:#f0c35a}.verdict.dangerous{border-color:#ff7a6b;background:rgba(60,18,22,.6)}.verdict.dangerous .bar i{background:#ff7a6b}
.meter{height:7px;margin:10px 0 6px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}.meter .s0{background:#ff6b6b}.meter .s1{background:#ff9f5a}.meter .s2{background:#f0c35a}.meter .s3{background:#8fd57a}.meter .s4{background:#4fd6a8}
.meter+div b{font-weight:500}.meter+div small{color:#a7c4c3}.meter+div ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:#c0d9d6}
.calc{margin-top:12px}.calc>b{display:block;font:500 20px var(--serif)}.calc>small{color:#a7c4c3}
.split{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--hair)}.split b{font-weight:500;font-size:14px}.split span{font:500 16px var(--sans);color:var(--champagne)}.split small{grid-column:1/-1;color:#a7c4c3;font-size:11.5px}
.grow{margin-top:10px}.grow div{display:grid;grid-template-columns:58px 1fr 88px;align-items:center;gap:8px;padding:3px 0;font-size:12px}.grow i{display:block;height:8px;border-radius:5px;background:linear-gradient(90deg,#bff3e6,var(--champagne))}.grow small{text-align:right;color:#d9f3ec}
.lbl .field{margin-top:4px}

/* Swan bloom */
.petal{position:fixed;left:0;top:0;z-index:44;border-radius:85% 0 85% 0;background:linear-gradient(135deg,#f6fcff 0%,#cfe8ff 45%,#8ec5ff 100%);box-shadow:0 0 10px #bfe3ffaa;pointer-events:none;opacity:0;animation:petal var(--d) cubic-bezier(.15,.65,.35,1) var(--delay) forwards}
@keyframes petal{0%{transform:translate(var(--x0),var(--y0)) rotate(0) scale(.3);opacity:0}8%{opacity:1}32%{transform:translate(var(--x1),var(--y1)) rotate(var(--r1)) scale(1)}100%{transform:translate(var(--x2),var(--y2)) rotate(var(--r2)) scale(.85);opacity:0}}
.spark{position:fixed;left:0;top:0;z-index:45;color:#fff;line-height:1;pointer-events:none;opacity:0;text-shadow:0 0 8px #e6f4ff,0 0 18px #8ec5ff,0 0 30px #8ec5ff;animation:spark var(--d) ease-out var(--delay) forwards}
@keyframes spark{0%{transform:translate(var(--x0),var(--y0)) scale(0) rotate(0);opacity:0}25%{opacity:1}45%{transform:translate(var(--x1),var(--y1)) scale(1.25) rotate(45deg);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(0) rotate(90deg);opacity:0}}
.logo-wrap.bloom{animation:bloom .75s ease}
@keyframes bloom{0%{filter:none}35%{filter:brightness(1.45) drop-shadow(0 0 26px #bfe3ff) drop-shadow(0 0 60px #8ec5ff88)}100%{filter:none}}
/* Private space */
.private-bar{display:none;align-items:center;gap:6px;width:min(100%,720px);margin:2px auto 0;padding:6px 10px;border:1px solid rgba(190,170,255,.35);border-radius:14px;background:rgba(40,28,70,.6);font-size:12px;color:#ddd3ff}
.private-bar span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.private-bar .mini{color:#ece6ff}
body.private.chatting .private-bar{display:flex}
body.private .user{background:linear-gradient(140deg,#4a3c86,#2f3a6e)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Companion */
body.private .bot{border-color:rgba(200,170,255,.28)}body.private .bot:before{box-shadow:0 0 14px #c8a8ff66}

/* Passcode screen */
.pass-row{display:flex;align-items:center;gap:6px;margin-top:8px}.pass-row .field{flex:1;font-size:16px}
.pass-msg{min-height:18px;margin:10px 0 4px!important;font-size:13px!important;color:#bfe8de!important}.pass-msg.bad{color:#ffb3a7!important}
.pass-go{width:100%;padding:13px;font-size:15px}.pass-go:disabled{opacity:.6}

/* Two-tap confirm and reset */
.armed{background:#ff7a6b!important;color:#2a0d08!important;border-color:transparent!important}
.pass-forgot{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}.pass-forgot span{display:block;margin-bottom:8px;font-size:12.5px;color:#a7c4c3}

/* Languages and Interpreter */
.trans{margin-top:9px;padding-top:8px;border-top:1px dashed var(--hair)}.trans small{color:#9fd8cc;font-size:11px}
.interp-langs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}.interp-langs .field{font-size:14px;padding:9px}
.interp-swap{font-size:20px;color:#bff3e6}
.interp-mic{width:100%;margin-top:12px;padding:18px;border:1px solid rgba(190,235,226,.35);border-radius:18px;background:linear-gradient(135deg,rgba(142,197,255,.2),rgba(49,122,120,.25));color:var(--white);font:500 16px var(--sans);cursor:pointer}
.interp-mic.on{background:#ff7a6b;color:#2a0d08;border-color:transparent;animation:pulse 1.2s infinite}
.interp-log{margin-top:12px}.interp-item{padding:10px 0;border-bottom:1px solid var(--hair)}.interp-item small{display:block;color:#a7c4c3;font-size:12px}.interp-out{margin:4px 0 8px;font:500 19px/1.35 var(--serif)}
.talk-interp{margin-top:6px}
select.field{appearance:auto}
</style>
</head>

async function reply(text,opts){if(reply.busy)return;setBusy(true);const c=cur(),quiet=opts&&opts.quiet;

}

    if(state==='play'){vy+=.36*dt;y+=vy*dt;if(!gates.length||gates[gates.length-1].x<W-Math.max(210,sw*.56)){const gap=Math.max(150,H*.28-score*1.2);gates.push({x:W+40,top:60+Math.random()*(H-gap-150),gap,done:false})}gates.forEach(g=>{g.x-=sp*dt;if(!g.done&&g.x+46<px){g.done=true;score++;tone(880,60)}if(px+20>g.x&&px-20<g.x+46&&(y-18<g.top||y+18>g.top+g.gap))over()});gates=gates.filter(g=>g.x>-70);if(y>H-14||y<0)over()}else if(state==='ready')y=H*.45+Math.sin(ms/320)*12;
    const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#071a2b');bg.addColorStop(.6,'#0d3a40');bg.addColorStop(1,'#04121a');x.fillStyle=bg;x.fillRect(0,0,W,H);x.fillStyle='#e8f6ff';x.shadowColor='#bff3e6';x.shadowBlur=45;x.beginPath();x.arc(W*.76,H*.17,34,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#ffffff88';for(let i=0;i<46;i++){x.fillRect((i*137.5-ms*.008*(1+i%3))%W+W*(i*137.5-ms*.008*(1+i%3)<0?1:0),(i*73)%(H*.72),1.5,1.5)}
    gates.forEach(g=>{const c=x.createLinearGradient(g.x,0,g.x+46,0);c.addColorStop(0,'#7fe8d3');c.addColorStop(1,'#4f8cff');x.fillStyle=c;x.shadowColor='#8ec5ff';x.shadowBlur=18;x.beginPath();x.roundRect(g.x,-20,46,g.top+20,12);x.roundRect(g.x,g.top+g.gap,46,H,12);x.fill();x.shadowBlur=0});

    x.textAlign='center';x.fillStyle='#fff';x.font="500 46px 'Cormorant Garamond',Georgia,serif";if(state!=='ready')x.fillText(score,W/2,calcTop());if(state==='ready'){x.fillText('Swan Glide',W/2,H*.27);x.font='15px Inter,sans-serif';x.fillText('Tap to flap. Glide through the gates.',W/2,H*.27+32)}if(state==='over'){x.fillText('Splash!',W/2,H*.33);x.font='16px Inter,sans-serif';x.fillText('Score '+score+'   Best '+Math.max(S.best,score),W/2,H*.33+34);x.fillText('Tap to fly again',W/2,H*.33+62)}}

function playDominoes(){gameShell('Dominoes',body=>{const start=()=>{let all=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)all.push([a,b]);all=shuffle(all);const you=all.splice(0,7),ai=all.splice(0,7),bone=all,chain=[];let over=false,lock=false,passes=0,choice=null,msg='';

    const place=(t,side)=>{if(!chain.length)return chain.push(t);if(side==='L')chain.unshift(t[1]===L()?t:[t[1],t[0]]);else chain.push(t[0]===R()?t:[t[1],t[0]])};

    const checkBlock=()=>{if(passes<2)return false;const a=pts(you),b=pts(ai);finish('Blocked. You '+a+' pips, AVIN '+b+'. '+(a<b?'You win!':a>b?'AVIN wins.':'A tie.'),a<b?20:5,a<b);return true};

function interpreter(){openSheet('🌐 Interpreter',s=>{let from=S.interpFrom||'auto',to=S.interpTo||(S.lang&&S.lang!=='auto'&&S.lang!=='en'?'en':'ur');
  const row=el('div','interp-langs');const fSel=langSelect(from,true,'Detect automatically'),tSel=langSelect(to,false);fSel.onchange=()=>{from=S.interpFrom=fSel.value;save()};tSel.onchange=()=>{to=S.interpTo=tSel.value;save()};row.append(fSel,btn('mini interp-swap','⇄',()=>{if(from==='auto')return toast('Pick a “from” language to swap');[from,to]=[to,from];fSel.value=from;tSel.value=to;S.interpFrom=from;S.interpTo=to;save()}),tSel);s.appendChild(row);
  const mic=btn('interp-mic','🎙️ Tap to speak',()=>toggle());const status=el('p','pass-msg');const t=el('textarea','field');t.rows=2;t.placeholder='Or type here...';const typeGo=btn('btn','Translate text',()=>{const v=t.value.trim();if(v){t.value='';run(v,from==='auto'?detectLang(v)||'':from)}});const out=el('div','interp-log');s.append(mic,status,t,typeGo,out);
  let rec=null;async function toggle(){if(rec){const r=rec;rec=null;mic.classList.remove('on');mic.textContent='🎙️ Tap to speak';status.textContent='Transcribing...';try{const blob=await r.stop();const d=await transcribe(blob,from==='auto'?'':from);if(!d.text){status.textContent='I didn’t catch that. Try again.';return}const src=from!=='auto'?from:(LANG_LIST.find(x=>x[1].toLowerCase().includes(String(d.language).toLowerCase()))||[''])[0];run(d.text,src)}catch(e){status.textContent=e.message||'Something went wrong.'}return}try{rec=await recordStart();mic.classList.add('on');mic.textContent='⏹️ Tap when done';status.textContent='Listening...'}catch(e){status.textContent=e.message==='Permission denied'?'Please allow the microphone.':(e.message||'Microphone unavailable')}}
  async function run(text,src){status.textContent='Translating to '+langName(to)+'...';const item=el('div','interp-item');item.appendChild(el('small','',(src?langName(src):'You')+': '+text));out.prepend(item);try{const tr=await translateText(text,to);status.textContent='';item.appendChild(el('div','interp-out',tr));const r=el('div','row');r.append(btn('btn sm','▶ Listen',()=>sayIn(tr,to)),btn('btn sm','Copy',()=>copy(tr)));item.appendChild(r);sayIn(tr,to)}catch{status.textContent='Translation failed. Try again.'}}
  s.appendChild(el('p','note-sm','Speech is transcribed by Whisper and spoken with your device’s voices. If a language sounds wrong or silent, add that voice in your phone’s text-to-speech settings.'))})}
setMode(mode);showChat();tick();if(S.sync)syncNow();
</script></body></html>
