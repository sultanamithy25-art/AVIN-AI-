<title>AVIN — Your Personal AI Assistant</title>
<style>
:root{--bg:#07050b;--glass:rgba(25,12,38,.82);--line:rgba(205,145,255,.58);--white:#fff7ff;--muted:#d9c7e8;--pink:#ff72c6;--blue:#c17aff;--purple:#9b5cff}
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--white);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 15%,#18275a 0%,#0a1230 35%,var(--bg) 75%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 83% 22%,#9ee8ff,transparent),radial-gradient(1px 1px at 72% 70%,#fff,transparent),radial-gradient(2px 2px at 25% 82%,#e7a6ff,transparent),radial-gradient(1px 1px at 92% 87%,#fff,transparent),radial-gradient(1px 1px at 44% 34%,#c7cfff,transparent);background-size:280px 280px;opacity:.8}
.app{position:relative;max-width:1180px;margin:auto;padding:22px;display:grid;grid-template-columns:94px 1fr;gap:24px;min-height:100vh}.sidebar{align-self:start;position:sticky;top:22px;border:1px solid var(--line);border-radius:28px;padding:12px 8px;background:linear-gradient(160deg,rgba(47,65,130,.7),rgba(8,16,45,.84));box-shadow:0 0 26px #777dff22,inset 0 0 18px #91bfff16;backdrop-filter:blur(18px)}
.nav{display:flex;flex-direction:column;gap:10px}.nav button{border:1px solid transparent;background:transparent;color:#d7d9ff;border-radius:18px;padding:13px 4px;cursor:pointer;font:14px Georgia}.nav button span{display:block;font:24px Arial;margin-bottom:6px}.nav button.active,.nav button:hover{background:linear-gradient(140deg,#5446ba,#1d4b93);border-color:#a8baff;box-shadow:0 0 22px #9b7dff55}
main{min-width:0;display:flex;flex-direction:column;align-items:center;padding:8px 0 24px}.top{width:100%;display:flex;justify-content:flex-end;gap:12px}.pill{border:1px solid var(--line);border-radius:30px;padding:10px 18px;background:#101a3bc9;color:white;box-shadow:inset 0 0 14px #8b9fff15}
.hero{text-align:center;padding:20px 0 24px;width:100%}.logo-wrap{width:240px;height:240px;margin:0 auto 12px;border:1px solid #a7c7ffb0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#3d68a966,#111b44a8 60%,#070d25);box-shadow:0 0 20px #9b83ff88,inset 0 0 30px #81cfff2b,0 0 55px #557aff22;position:relative}.logo-wrap:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #d7d9ff45}.logo-wrap .swan-img{width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 0 10px #87d9ff80)}
h1{font-size:clamp(42px,7vw,64px);font-weight:400;letter-spacing:.2em;margin:4px 0 6px;text-shadow:0 0 20px #c3baff88}.tagline{letter-spacing:.28em;color:#c5cbf6;font:12px Arial,sans-serif}.always{font-size:24px;font-style:italic;margin:18px 0 0;color:#e4ddff}.glass{background:linear-gradient(130deg,rgba(34,51,105,.78),rgba(10,19,50,.78));border:1px solid var(--line);border-radius:28px;box-shadow:0 0 22px #7f91ff24,inset 0 0 18px #b2d8ff10;backdrop-filter:blur(18px)}.welcome{width:min(100%,760px);padding:22px 26px;display:flex;gap:18px;align-items:center;margin-bottom:26px}.mini-logo{flex:0 0 62px;width:62px;height:62px;border-radius:50%;border:1px solid #c4d2ff;background:#101b43;display:grid;place-items:center;box-shadow:0 0 18px #7f8cff55}.mini-logo .swan-img{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 0 5px #87d9ff80)}.welcome h2{font-size:23px;font-weight:400;margin:0 0 8px}.welcome p{margin:0;color:#d4d9ff;line-height:1.6;font-size:17px}.tiles{width:min(100%,760px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;color:var(--white);text-align:left;transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-3px);border-color:#e5b5ff;box-shadow:0 0 26px #9c7aff36}.tile-icon{width:52px;height:52px;border:1px solid #a7bbff77;border-radius:50%;display:grid;place-items:center;font:25px Arial;background:#121e47}.tile b{font-size:18px;font-weight:400}.tile small{display:block;color:#c7cff6;font-size:14px;margin-top:5px}.arrow{margin-left:auto;font:28px Arial;color:#c5c8ff}.spacer{flex:1;min-height:45px}.composer{width:min(100%,820px);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:50px;background:#09132f;border:1px solid #8eaaff;box-shadow:0 0 26px #768cff44,inset 0 0 16px #21366c;position:sticky;bottom:12px}.star{font:30px Arial;color:#e3c7ff;text-shadow:0 0 12px #b89aff;padding:0 8px}.composer input{flex:1;min-width:0;background:#0b1532;color:white;border:0;outline:0;padding:15px 10px;font:17px Georgia;border-radius:12px}.composer input::placeholder{color:#b7c2e9}.send{width:56px;height:56px;border-radius:50%;border:1px solid #f0c6ff;background:linear-gradient(145deg,#b4a0ff,#6846d8);color:white;font:26px Arial;box-shadow:0 0 18px #b18cff88;cursor:pointer}.footer{font-size:14px;letter-spacing:.12em;color:#c3c9f3;margin:24px 0 0;text-align:center}.chatlog{width:min(100%,760px);margin:0 0 18px;display:flex;flex-direction:column;gap:10px}.message{padding:13px 17px;border-radius:18px;max-width:85%;line-height:1.5}.user{align-self:flex-end;background:#37316e;border:1px solid #9e9aff}.bot{align-self:flex-start;background:#101d42;border:1px solid #7899db}.note{font:12px Arial;color:#9eacd8;margin-top:10px;text-align:center}
@media(max-width:650px){.app{grid-template-columns:64px 1fr;gap:10px;padding:12px}.sidebar{border-radius:22px;padding:8px 4px}.nav button{font-size:11px;padding:11px 1px}.nav button span{font-size:21px}.logo-wrap{width:170px;height:170px}.logo-wrap .swan-img{width:135px;height:135px}.hero{padding-top:24px}.welcome{padding:17px;gap:12px}.welcome h2{font-size:20px}.welcome p{font-size:15px}.mini-logo{flex-basis:48px;width:48px;height:48px}.tiles{gap:10px}.tile{padding:13px;gap:8px}.tile-icon{width:38px;height:38px;font-size:20px}.tile b{font-size:15px}.tile small{font-size:12px}.arrow{font-size:20px}.composer{gap:3px;padding:7px}.composer input{font-size:14px;padding:13px 5px}.star{font-size:23px;padding:0 3px}.send{width:44px;height:44px;font-size:21px}.tagline{letter-spacing:.16em;font-size:10px}.always{font-size:20px}}
@media(max-width:390px){.app{grid-template-columns:54px 1fr}.nav button span{font-size:18px}.nav button{font-size:10px}.tile{padding:10px}.tile-icon{display:none}}

.composer{background:#071317;border-color:#4f8cff;box-shadow:0 0 26px #4f8cff1c,inset 0 0 16px #173b3b}.composer input{background:#09181c}.composer input::placeholder{color:#91aaa8}.star{color:#b8c5ff;text-shadow:0 0 12px #b8c5ff88}.send{border-color:#a9f3e7;background:linear-gradient(145deg,#8ec5ff,#397e82);box-shadow:0 0 18px #4f8cff44}

</style>
